services:
  gojo:
    build:
      context: .
      dockerfile: ./Dockerfile.go-jo
    container_name: go-jo
    image: go-jo:1.0
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      - syslog

  syslog:
      build:
        context: .
        dockerfile: ./Dockerfile.syslog
      container_name: syslog
      ports:
        - "516:516"